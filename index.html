<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Tracker — Plan. Track. Learn. Build.</title>
<meta name="description" content="A personal command center for habits, prayers, academics, finance, reading, and development — synced privately via your own GitHub Gist, no server required.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div id="loader">
  <svg id="loaderWeb" viewBox="0 0 200 200" width="90" height="90">
    <g fill="none" stroke="#E1261C" stroke-width="1.2" opacity="0.9">
      <path class="web-line" d="M100 20 L100 180"/>
      <path class="web-line" d="M20 100 L180 100"/>
      <path class="web-line" d="M35 35 L165 165"/>
      <path class="web-line" d="M165 35 L35 165"/>
      <circle class="web-ring" cx="100" cy="100" r="30"/>
      <circle class="web-ring" cx="100" cy="100" r="55"/>
      <circle class="web-ring" cx="100" cy="100" r="80"/>
    </g>
  </svg>
  <div id="loaderTitle">LIFE TRACKER</div>
  <div id="loaderTag">PLAN &nbsp;•&nbsp; TRACK &nbsp;•&nbsp; LEARN &nbsp;•&nbsp; BUILD</div>
</div>

<div id="app">
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <div class="row" style="gap:0;">
        <button class="menu-btn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="actions" id="topActions"></div>
    </div>
    <div class="view" id="view"></div>
  </div>
  <button id="quickAddBtn" onclick="toggleQuickAdd()" title="Quick add">+</button>
  <div id="quickAddMenu" class="quick-add-menu"></div>
  <div id="searchOverlay" class="search-overlay">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search tasks, journal, courses, research, people…" oninput="runSearch(this.value)">
      <div id="searchResults"></div>
      <button class="btn sm" onclick="closeSearch()" style="margin-top:10px;">Close</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
